    position:absolute;

  @keyframes crt-band{

    #terminal::after{content:none;}

  #content.hack-content{display:flex;flex-direction:column;justify-content:flex-start;padding:calc(4px * var(--scale));padding-bottom:calc(22px * var(--scale));}
  #header.hack-header{padding-top:calc(16px * var(--scale));padding-bottom:calc(4px * var(--scale));}

  #header.hack-header #attempts .attempt-block:last-child{margin-right:0;}
    #header.hack-header #hack-warning{margin-bottom:calc(4px * var(--scale));}
    #terminal-screen{height:100%;display:flex;flex-direction:column;transition:transform 1s linear;}

</style>

<body>

<script>
function updateScale(width=window.innerWidth, height=window.innerHeight){
  const scale=Math.min(
    3,
    Math.max(
      0.7,
      Math.min(
        width*0.98/621,
        height*0.98/660
      )*0.93
    )
  );
  document.documentElement.style.setProperty('--scale',scale);
}
let prevWidth=window.innerWidth;
let prevHeight=window.innerHeight;
window.addEventListener('resize',()=>{
  const w=window.innerWidth;
  const h=window.innerHeight;
  if(w!==prevWidth || h!==prevHeight){
    prevWidth=w;
    prevHeight=h;
    updateScale(w,h);
  }
});
updateScale(prevWidth,prevHeight);
const defaultBootSequence=[
  {type:'terminal',text:'Welcome to RobCo Industries (TM) Termlink'},
  {type:'terminal',text:''},
  {type:'user',text:'Logon Admin'},
  {type:'terminal',text:''},
  {type:'terminal',text:'Enter Password'},
  {type:'terminal',text:''},
  {type:'user',text:'********'}
];
const defaultLockedBootSequence=[
  {type:'terminal',text:'WELCOME TO ROBCO INDUSTRIES (TM) TERMLINK'},
  {type:'terminal',text:''},
  {type:'user',text:'SET TERMINAL/INQUIRE'},
  {type:'terminal',text:''},
  {type:'terminal',text:'RIT-V300'},
  {type:'terminal',text:''},
  {type:'user',text:'SET FILE/PROTECTION=OWNER:RWED ACCOUNTS.F'},
  {type:'user',text:'SET HALT RESTART/MAINT'},
  {type:'terminal',text:''},
  {type:'terminal',text:'Initializing Robco Industries (TM) MF Boot Agent v2.3.0'},
  {type:'terminal',text:'RETROS BIOS'},
  {type:'terminal',text:'RBIOS-4.02.08.00 52EE5.E7.E8'},
  {type:'terminal',text:'Copyright 2201-2203 Robco Ind.'},
  {type:'terminal',text:'Uppermem: 64 KB'},
  {type:'terminal',text:'Root (5A8)'},
  {type:'terminal',text:'Maintenance Mode'},
  {type:'terminal',text:''},
  {type:'user',text:'RUN DEBUG/ACCOUNTS.F'}
];
let titleLines=[];
let headerLines=[];
let bootSequence=defaultBootSequence;
let lockedBootSequence=defaultLockedBootSequence;
let screens={};
let hacking={};
let commands={};
let startLocked=true;
let baseStyle={textColor:'#7aff7a',backgroundColor:'#041204',borderColor:'#008800'};

let uploadedConfig=null;
let powered=false;
const activeTimeouts=new Set();
const pendingWaits=new Set();
const activeAudios=new Set();
let currentCycle=0;

function setTrackedTimeout(fn,ms){
  const id=setTimeout(()=>{activeTimeouts.delete(id);fn();},ms);
  activeTimeouts.add(id);
  return id;
}
function clearAllTimeouts(){
  for(const id of activeTimeouts) clearTimeout(id);
  activeTimeouts.clear();
}
function trackAudio(audio){
  activeAudios.add(audio);
  audio.addEventListener('ended',()=>activeAudios.delete(audio));
  return audio;
}

const preloadedAudios=[];
const customAudioCache=new Map();

function preloadAudio(src){
  const audio=new Audio(src);
  audio.preload='auto';
  preloadedAudios.push(audio);
  return audio;
}

function preloadCustomAudio(src){
  if(typeof src!=='string') return null;
  const key=src.trim();
  if(!key) return null;
  if(customAudioCache.has(key)) return customAudioCache.get(key);
  const audio=new Audio(key);
  audio.preload='auto';
  preloadedAudios.push(audio);
  customAudioCache.set(key,audio);
  return audio;
}

function playCachedAudio(audio,volume){
  activeAudios.add(audio);
  audio.currentTime=0;
  audio.volume=volume;
  audio.play();
  audio.addEventListener('ended',()=>activeAudios.delete(audio),{once:true});
}

function playCustomSound(src,volume){
  if(!powered) return false;
  if(typeof src!=='string') return false;
  const key=src.trim();
  if(!key) return false;
  const audio=preloadCustomAudio(key);
  if(!audio) return false;
  playCachedAudio(audio,volume);
  return true;
}

function playCustomHoverSound(src){
  return playCustomSound(src,focusVolume);
}

function playCustomSelectSound(src){
  return playCustomSound(src,selectVolume);
}

async function resumePreloadedAudio(){
  for(const audio of preloadedAudios){
    try{
      audio.muted=true;
      await audio.play();
      audio.pause();
      audio.muted=false;
      audio.currentTime=0;
    }catch(e){
      console.warn('Preloaded audio resume failed',e);
    }
  }
}
function stopAllAudio(){
  for(const audio of activeAudios){
    audio.pause();
    audio.currentTime=0;
  }
  activeAudios.clear();
  stopScrollSound();
  stopFanHum();
}
function cancelWaits(){
  for(const cleanup of pendingWaits) cleanup();
  pendingWaits.clear();
}

async function loadConfig(cycle=currentCycle){
  let cfg;
  if(uploadedConfig){
    cfg=uploadedConfig;
  }else{
    try {
      cfg=await fetch('config.json').then(res=>res.json());
    } catch (err) {
      cfg={};
    }
  }
  if(cycle!==currentCycle) return;
  titleLines=cfg.titleLines;
  headerLines=cfg.headerLines;
  bootSequence = Array.isArray(cfg.bootSequence) && cfg.bootSequence.length ? cfg.bootSequence : defaultBootSequence;
  lockedBootSequence = Array.isArray(cfg.lockedBootSequence) && cfg.lockedBootSequence.length ? cfg.lockedBootSequence : defaultLockedBootSequence;
  screens=cfg.screens || {};
  hacking = cfg.hacking || {};
  commands={};
  if(cfg.commands){
    for(const [name,info] of Object.entries(cfg.commands)){
      const key=name.toLowerCase();
      commands[key]=info;
      if(info.help){
        if(!screens.help) screens.help=[];
        const item={text:`> ${name}`};
        if(info.screen) item.screen=info.screen;
        if(info.command) item.command=info.command;
        if(info.selectSound) item.selectSound=info.selectSound;
        if(info.hoverSound) item.hoverSound=info.hoverSound;
        const helpItems=screens.help;
        const retIdx=helpItems.findIndex(it=>typeof it==='object' && it.screen==='menu');
        if(retIdx>=0) helpItems.splice(retIdx,0,item); else helpItems.push(item);
      }
    }
  }
  if(savedUserSpeed===null && cfg.userSpeed!==undefined){
    userBaseSpeed=cfg.userSpeed;
    userSpeed=userBaseSpeed;
    if(userSpeedSelect) userSpeedSelect.value=String([58,75,91,100].includes(userBaseSpeed)?userBaseSpeed:75);
  }
  if(savedCompSpeed===null && cfg.compSpeed!==undefined){
    compBaseSpeed=cfg.compSpeed;
    compSpeed=compBaseSpeed;
    if(compSpeedSelect) compSpeedSelect.value=String([80,90,95,100].includes(compBaseSpeed)?compBaseSpeed:90);
  }
  if(cfg.style){
    const {textColor, backgroundColor, borderColor}=cfg.style;
    if(textColor) document.documentElement.style.setProperty('--text-color', textColor);
    if(backgroundColor) document.documentElement.style.setProperty('--terminal-bg', backgroundColor);
    if(borderColor) document.documentElement.style.setProperty('--border-color', borderColor);
  }
  if(cfg.hackingStyle){
    const {textColor, backgroundColor, borderColor}=cfg.hackingStyle;
    if(textColor) document.documentElement.style.setProperty('--hacking-text-color', textColor);
    if(backgroundColor) document.documentElement.style.setProperty('--hacking-bg', backgroundColor);
    if(borderColor) document.documentElement.style.setProperty('--hacking-border-color', borderColor);
  }
  const computed=getComputedStyle(document.documentElement);
  baseStyle={
    textColor:computed.getPropertyValue('--text-color').trim(),
    backgroundColor:computed.getPropertyValue('--terminal-bg').trim(),
    borderColor:computed.getPropertyValue('--border-color').trim()
  };
  startLocked=cfg.locked!==undefined?cfg.locked:true;
  if(hasHacked) startLocked=false;
  preloadConfigAudio();
}

function preloadConfigAudio(){
  const sources=new Set();
  if(screens && typeof screens==='object'){
    for(const data of Object.values(screens)){
      const items=Array.isArray(data)?data:((data&&data.items)||[]);
      if(!items) continue;
      for(const item of items){
        if(item && typeof item==='object'){
          if(typeof item.selectSound==='string' && item.selectSound.trim()) sources.add(item.selectSound.trim());
          if(typeof item.hoverSound==='string' && item.hoverSound.trim()) sources.add(item.hoverSound.trim());
        }
      }
    }
  }
  for(const info of Object.values(commands||{})){
    if(info && typeof info==='object'){
      if(typeof info.selectSound==='string' && info.selectSound.trim()) sources.add(info.selectSound.trim());
      if(typeof info.hoverSound==='string' && info.hoverSound.trim()) sources.add(info.hoverSound.trim());
    }
  }
  for(const src of sources){
    preloadCustomAudio(src);
  }
}

const terminal=document.getElementById('terminal');
const terminalScreen=document.getElementById('terminal-screen');
const powerButton=document.getElementById('power-button');
const powerScreen=document.getElementById('power-screen');
const header=document.getElementById('header');
const content=document.getElementById('content');
const input=document.getElementById('input');
const isTouch=('ontouchstart' in window || navigator.maxTouchPoints>0 || window.matchMedia('(pointer: coarse)').matches);
function focusInput(){if(!isTouch) input.focus();}
const configFile=document.getElementById('config-file');
const configButton=document.getElementById('config-button');
const historyEl=content;

function handleConfigLoaded(){
  const startSound=trackAudio(new Audio('Terminal 4/Insert.wav'));
  startSound.play();
  if(powered){
    powerButton.click();
  }
}

configFile.addEventListener('change',async e=>{
  const file=e.target.files[0];
  if(file){
    try{
      const text=await file.text();
      uploadedConfig=JSON.parse(text);
      handleConfigLoaded();
    }catch(err){
      console.error('Invalid configuration file',err);
      uploadedConfig=null;
    }
  }
});
configButton.addEventListener('click',()=>{
  trackAudio(new Audio('Terminal 4/Eject.wav')).play();
  configFile.click();
});
window.addEventListener('message', e => { uploadedConfig = e.data; handleConfigLoaded(); });
let currentOptions=[];

function getSessionSnapshot(){
  const currentScreen=currentScreenName || (screenHistory.length?screenHistory[screenHistory.length-1]:null);
  if(!currentScreen) return null;
  return {
    screenHistory:screenHistory.slice(),
    currentScreen,
    inputText,
    options:currentOptions.map(opt=>opt.textContent.trim())
  };
}

function persistSessionState(){
  if(restoringSession) return;
  if(skipNextSessionSave){
    skipNextSessionSave=false;
    return;
  }
  const snapshot=getSessionSnapshot();
  if(!snapshot) return;
  try{
    localStorage.setItem(SESSION_STATE_KEY,JSON.stringify(snapshot));
  }catch(err){
    console.warn('Failed to save session state',err);
  }
}

function loadPersistedSessionState(){
  try{
    const raw=localStorage.getItem(SESSION_STATE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(err){
    console.warn('Failed to load session state',err);
    return null;
  }
}

function clearPersistedSessionState(){
  try{
    localStorage.removeItem(SESSION_STATE_KEY);
  }catch(err){
    console.warn('Failed to clear session state',err);
  }
}

async function restoreSessionStateIfAvailable(){
  const saved=loadPersistedSessionState();
  if(!saved || !saved.currentScreen) return false;
  if(typeof saved.currentScreen!=='string') return false;
  if(saved.screenHistory && !Array.isArray(saved.screenHistory)) return false;
  if(saved.currentScreen && !screens[saved.currentScreen]) return false;
  const history=Array.isArray(saved.screenHistory)?saved.screenHistory.slice():[];
  screenHistory=history.length?history.slice(0,-1):[];
  let restored=false;
  restoringSession=true;
  try{
    await showScreen(saved.currentScreen);
    input.textContent=saved.inputText||'';
    inputText=saved.inputText||'';
    updateInput();
    restored=true;
  }catch(err){
    console.warn('Failed to restore session state',err);
    screenHistory=[];
    currentScreenName=null;
  }finally{
    restoringSession=false;
  }
  if(!restored) return false;
  focusInput();
  persistSessionState();
  return true;
}

function placeCaretAtEnd(el){
  const range=document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function startHacking(){
  terminalLocked=false;
  hackingActive=true;
  try{
    const res=await fetch('Hacking Words.txt');
    const text=await res.text();
    const all=(text.match(/[A-Za-z]+/g)||[]).map(w=>w.toUpperCase());
    const byLen={};
    for(const w of all){
      const l=w.length;
      (byLen[l]||(byLen[l]=new Set())).add(w);
    }
    const difficulties=hacking.difficulties;
    if(!Array.isArray(difficulties)||!difficulties.length) throw new Error('Invalid hacking configuration');
    let diff;
    if(hacking.difficulty){
      diff=difficulties.find(d=>d.name===hacking.difficulty);
      if(!diff) throw new Error('Invalid hacking configuration');
    }else{
      diff=difficulties[Math.floor(Math.random()*difficulties.length)];
    }
    const fixedPassword=hacking.password?hacking.password.toUpperCase():null;
    let fixedDuds=(hacking.dudWords||[]).map(w=>w.toUpperCase());
    fixedDuds=Array.from(new Set(fixedDuds.filter(w=>w!==fixedPassword)));
    let targetLen;
    if(fixedPassword){
      targetLen=fixedPassword.length;
    }else if(fixedDuds.length){
      targetLen=fixedDuds[Math.floor(Math.random()*fixedDuds.length)].length;
    }else{
      targetLen=diff.length[0]+Math.floor(Math.random()*(diff.length[1]-diff.length[0]+1));
    }
    if(targetLen<diff.length[0]||targetLen>diff.length[1]){
      diff.length=[targetLen,targetLen];
    }
    for(const w of fixedDuds){
      if(w.length!==targetLen) throw new Error('Invalid hacking configuration');
    }
    const maxCount=diff.wordCount[1];
    const minCount=diff.wordCount[0];
    if(minCount>maxCount) throw new Error('Invalid hacking configuration');
    const count=minCount+Math.floor(Math.random()*(maxCount-minCount+1));
    const fixedWords=fixedPassword?[fixedPassword,...fixedDuds]:[...fixedDuds];
    const pool=Array.from(byLen[targetLen]||[]).filter(w=>!fixedWords.includes(w));
    let wordList,usedDuds;
    if(fixedWords.length>=count){
      const dudsCopy=fixedDuds.slice();
      shuffle(dudsCopy);
      const neededDuds=count-(fixedPassword?1:0);
      usedDuds=dudsCopy.slice(0,neededDuds);
      wordList=(fixedPassword?[fixedPassword]:[]).concat(usedDuds);
    }else{
      if(pool.length<count-fixedWords.length) throw new Error('Insufficient words');
      shuffle(pool);
      usedDuds=fixedDuds.slice();
      wordList=fixedWords.concat(pool.slice(0,count-fixedWords.length));
    }
    wordList=Array.from(new Set(wordList));
    usedDuds=Array.from(new Set(usedDuds.filter(w=>wordList.includes(w))));
    shuffle(wordList);
    const password=fixedPassword|| (usedDuds.length?usedDuds[Math.floor(Math.random()*usedDuds.length)]:wordList[Math.floor(Math.random()*wordList.length)]);
    const attempts = hacking.attempts ?? 4;
    const maxAttempts = hacking.maxAttempts ?? 4;
    hackingData={
      attempts,
      maxAttempts,
      password,
      wordList,
      difficulty:diff.name,
      activeWords:wordList.filter(w=>w!==password)
    };
    await renderHackScreen();
  }catch(err){
    console.error('Failed to start hacking',err);
    hackingActive=false;
    if(err.message==='Invalid hacking configuration'){
      displayMessage('INVALID HACKING CONFIG');
    }else{
      displayMessage('WORD LIST UNAVAILABLE');
    }
  }
}

function detectBrackets(block){
  const pairs=[];
  const wordIndices=new Set();
  for(const w of block.words){
    const seg=w.segment||w.word;
    for(let k=0;k<seg.length;k++){
      wordIndices.add(w.start+k);
    }
  }
  const openToClose={'(':')','{':'}','[':']','<':'>'};
  const closeToOpen={')':'(','}':'{',']':'[','>':'<'};
  const stack=[];
  for(let i=0;i<block.chars.length;i++){
    if(wordIndices.has(i)){
      stack.length=0;
      continue;
    }
    const ch=block.chars[i];
    if(openToClose[ch]){
      stack.push({ch,index:i,depth:stack.length});
    }else if(closeToOpen[ch]){
      for(let s=stack.length-1;s>=0;s--){
        const open=stack[s];
        if(open.ch===closeToOpen[ch]){
          pairs.push({start:open.index,end:i,depth:open.depth});
          stack.splice(s,1);
          break;
        }
      }
    }
  }
  block.brackets=pairs.sort((a,b)=>a.start-b.start||a.depth-b.depth);
}

function blockHtml(block){
  const wrapChar=ch=>`<span class="char">${escapeHtml(ch)}</span>`;
  const wordMap=new Map();
  for(const w of block.words){
    const seg=w.segment||w.word;
    wordMap.set(w.start,{end:w.start+seg.length,word:w.word,text:seg});
  }
  const opens=new Map(),closes=new Map();
  for(const b of block.brackets||[]){
    if(!opens.has(b.start)) opens.set(b.start,[]);
    if(!closes.has(b.end)) closes.set(b.end,[]);
    opens.get(b.start).push(b.depth);
    closes.get(b.end).push(b.depth);
  }
  for(const arr of opens.values()) arr.sort((a,b)=>a-b);
  for(const arr of closes.values()) arr.sort((a,b)=>b-a);
  let html='';
  for(let i=0;i<block.chars.length;i++){
    if(opens.has(i)){
      for(const _ of opens.get(i)) html+='<span class="bracket">';
    }
    if(wordMap.has(i)){
      const w=wordMap.get(i);
      html+=`<span class="word" data-word="${w.word}">${w.text}</span>`;
      i=w.end-1;
    }else{
      html+=wrapChar(block.chars[i]);
    }
    if(closes.has(i)){
      for(const _ of closes.get(i)) html+='</span>';
    }
  }
  return html;
}

  await typeText(attempts,attemptsText);

  updateAttempts();
  const rows=17,cols=12,total=rows*2;
    const base=0xF000+Math.floor(Math.random()*(0xFFF-cols*total));
    const chars='{}[]()<>/\\|;:!@#$%^&*-_=+,.?';
    hackingData.junkChars=chars;
    const blocks=[];
  for(let i=0;i<total;i++){
    const arr=[];
    for(let j=0;j<cols;j++) arr.push(chars[Math.floor(Math.random()*chars.length)]);
    blocks.push({addr:(base+i*cols).toString(16).toUpperCase().padStart(4,'0'),chars:arr,words:[]});
  }
  const MAX_PLACEMENT_ATTEMPTS = 1000;
    for(const word of hackingData.wordList){
    const parts=[];
    for(let i=0;i<word.length;i+=cols) parts.push(word.slice(i,i+cols));
    const maxLen=parts.reduce((m,p)=>Math.max(m,p.length),0);
    if(parts.length>rows){
      console.warn('Word too long to place', word);
      continue;
    }
    let placed = false;
    for(let attempts=0; attempts<MAX_PLACEMENT_ATTEMPTS; attempts++){
      const col=Math.floor(Math.random()*2);
      const row=Math.floor(Math.random()*(rows-parts.length+1));
      const start=Math.floor(Math.random()*(cols-maxLen+1));
      let ok=true;
      for(let p=0;p<parts.length;p++){
        const block=blocks[col*rows+row+p];
        const seg=parts[p];
        if(block.words.some(w=>!(start+seg.length<=w.start || start>=w.start+(w.segment||w.word).length))){
          ok=false;break;
        }
      }
      if(!ok) continue;
      for(let p=0;p<parts.length;p++){
        const block=blocks[col*rows+row+p];
        const seg=parts[p];
        for(let k=0;k<seg.length;k++) block.chars[start+k]=seg[k];
        block.words.push({start,word,segment:seg});
      }
      placed = true;
      break;
    }
    if(!placed){
      console.warn('Failed to place word', word);
    }
    }
    for(const block of blocks) detectBrackets(block);
    let gridHtml='';
  for(let r=0;r<rows;r++){
    const left=blocks[r];
    const right=blocks[r+rows];
    gridHtml+=`<div class="hack-row"><span class="hack-addr">0x${left.addr}</span> <span class="hack-block">${blockHtml(left)}</span><span class="hack-gap"></span><span class="hack-addr">0x${right.addr}</span> <span class="hack-block">${blockHtml(right)}</span></div>`;
  }
  await typeHtml(grid, gridHtml);

  function processGuess(guess,playSound=true){
    if(!hackingActive) return;
    guess=guess.trim().toUpperCase();
    const len=hackingData.password.length;
    const box=document.createElement('div');
    box.className='hack-message';
    const guessLine=document.createElement('div');
    guessLine.textContent=`>${guess}`;
    box.appendChild(guessLine);
    if(playSound) playEnterCharSound();
    if(guess===hackingData.password){
      const likeLine=document.createElement('div');
      likeLine.textContent=`${len}/${len} correct`;
      box.appendChild(likeLine);
      const ok=document.createElement('div');
      ok.textContent='Access granted.';
      box.appendChild(ok);
      insertHackBox(box);
      hackingActive=false;
      hackingData.promptEl.textContent='';
      hackingData.warningEl.textContent='';
      hackingData.attemptsEl.textContent='';
      playPasswordResult(true);
      hackedPasswordLength=hackingData.password.length;
      hasHacked=true;
      setTrackedTimeout(()=>showIntro(),500);
    }else{
      let like=0;
      for(let i=0;i<len;i++) if(guess[i]===hackingData.password[i]) like++;
      const denied=document.createElement('div');
      denied.textContent='Entry denied';
      box.appendChild(denied);
      const likeLine=document.createElement('div');
      likeLine.textContent=`${like}/${len} correct`;
      box.appendChild(likeLine);
      insertHackBox(box);
      hackingData.attempts--;
      updateAttempts();
      playPasswordResult(false);
      if(hackingData.attempts<=0){
        lockTerminal();
      }
    }
  input.textContent='';
  inputText='';
  updateInput();
  focusInput();
  }

  line.textContent=text;
  box.appendChild(line);
  insertHackBox(box);
}

function removeDud(){
  const candidates=hackingData.activeWords.filter(w=>!hackingData.removedWords?.has(w));
  if(!candidates.length) return;
  const word=candidates[Math.floor(Math.random()*candidates.length)];
  if(!hackingData.removedWords) hackingData.removedWords=new Set();
  hackingData.removedWords.add(word);
  hackingData.activeWords=hackingData.activeWords.filter(w=>w!==word);
  const chars=hackingData.junkChars;
  hackingData.grid.querySelectorAll(`.word[data-word="${word}"]`).forEach(span=>{
    const len=span.textContent.length;
    let junk='';
    for(let i=0;i<len;i++) junk+=chars[Math.floor(Math.random()*chars.length)];
    span.innerHTML=junk.split('').map(c=>`<span class="char">${escapeHtml(c)}</span>`).join('');
    span.classList.remove('word');
    span.removeAttribute('data-word');
  });
  addHackMessage('> Dud removed');
}

function resetAttempts(){
  hackingData.attempts=hackingData.maxAttempts;
  updateAttempts();
  addHackMessage('> Allowance replenished');
}

function useBracket(span){
  if(span.classList.contains('used')) return;
  span.classList.add('used');
  const len=span.textContent.length;
  const chars=hackingData.junkChars;
  let junk='';
  for(let i=0;i<len;i++) junk+=chars[Math.floor(Math.random()*chars.length)];
  const frag=document.createDocumentFragment();
  for(const ch of junk){
    const el=document.createElement('span');
    el.className='char';
    el.textContent=ch;
    frag.appendChild(el);
  }
  span.replaceWith(frag);
  if(Math.random()<0.5){
    removeDud();
  }else{
    resetAttempts();
  }
}

function displayMessage(text){
  const div=document.createElement('div');
  div.className='response';
  div.textContent=text;
  if(input.parentElement){
    input.parentElement.insertBefore(div,input);
  }
  setTrackedTimeout(()=>div.classList.add('fade'),5000);
  setTrackedTimeout(()=>div.remove(),6000);
}

function clearResponses(){
  document.querySelectorAll('.response').forEach(el=>el.remove());
}

async function executeCustomCommand(info){
  ensureSelectSound(info);
  if(info.screen){
    await showScreen(info.screen);
    if(info.command){
      await new Promise(requestAnimationFrame);
      displayMessage(info.command);
    }
  }else if(info.command){
    displayMessage(info.command);
  }
}

async function executeCommand(info, rawCmd){
  if(info.action){
    switch(info.action){
      case 'syntaxhelper':
        ensureSelectSound(info);
        if(hackingActive){
          hackingData.grid.querySelectorAll('.bracket').forEach(span=>span.classList.add('highlight'));
          setTrackedTimeout(()=>hackingData.grid.querySelectorAll('.bracket').forEach(span=>span.classList.remove('highlight')),1000);
        }else if(info.command){
          displayMessage(info.command);
        }else{
          displayMessage('command unknown');
        }
        break;
      case 'back':
        ensureSelectSound(info);
        goBack();
        if(info.command) displayMessage(info.command);
        break;
      case 'help':
        ensureSelectSound(info);
        await showScreen(info.screen || 'help');
        if(info.command) displayMessage(info.command);
        break;
      case 'adminoverride':
        ensureSelectSound(info);
        if(hackingActive){
          commandAdminOverride(rawCmd, info.command);
        }else if(info.command){
          displayMessage(info.command);
        }else{
          displayMessage('command unknown');
        }
        break;
      case 'adminallowances':
        ensureSelectSound(info);
        if(hackingActive){
          commandAdminAllowances(rawCmd, info.command);
        }else if(info.command){
          displayMessage(info.command);
        }else{
          displayMessage('command unknown');
        }
        break;
      default:
        await executeCustomCommand(info);
    }
  }else{
    await executeCustomCommand(info);
  }
}

async function handleCommand(cmd){
  if(typing) return;
  playEnterCharSound();
  clearResponses();
  if(terminalLocked){
    input.textContent='';
    inputText='';
    updateInput();
    return;
  }
  const raw=cmd.trim();
  const command=raw.toLowerCase();
  const custom=commands[command];
  if(hackingActive){
    if(custom && custom.hacking){
      await executeCommand(custom, raw);
    }else{
      processGuess(raw.toUpperCase().slice(0,20),false);
    }
  }else if(custom){
    await executeCommand(custom, raw);
  }else{
    const match=currentOptions.find(o=>{
      const text=o.textContent.trim().toLowerCase().replace(/^> ?/, '');
      return text===command;
    });
    if(match){
      match.click();
    }else if(screens[command]){
      await showScreen(command);
    }else{
      displayMessage('command unknown');
    }
  }
  input.textContent='';
  inputText='';
  updateInput();
  focusInput();
  persistSessionState();
}

const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
fanHumGain=audioCtx.createGain();
fanHumGain.gain.value=humVolume;
fanHumGain.connect(audioCtx.destination);

let scrollBuffer;
let scrollTimeout;
let lastScrollTime=0;
const scrollIntervalMs=750;

async function loadScrollSound(){
  const res=await fetch('Terminal 3/charscroll_lp.wav');
  const buf=await res.arrayBuffer();
  scrollBuffer=await audioCtx.decodeAudioData(buf);
}

function playScrollSound(){
  if(!scrollBuffer || !powered) return;
  lastScrollTime=Date.now();
  const src=audioCtx.createBufferSource();
  src.buffer=scrollBuffer;
  const gain=audioCtx.createGain();
  gain.gain.value=scrollVolume;
  src.connect(gain).connect(audioCtx.destination);
  src.start();
  scrollTimeout=setTrackedTimeout(playScrollSound,scrollIntervalMs);
}
function startScrollSound(){
  if(scrollTimeout || !powered) return;
  const elapsed=Date.now()-lastScrollTime;
  if(elapsed>=scrollIntervalMs){
    playScrollSound();
  }else{
    scrollTimeout=setTrackedTimeout(playScrollSound,scrollIntervalMs-elapsed);
  }
}

function goBack(){
  if(screenHistory.length>1){
    screenHistory.pop();
    const prev=screenHistory.pop();
    showScreen(prev);
  }
}
function stopScrollSound(){
  if(!scrollTimeout) return;
  clearTimeout(scrollTimeout);
  scrollTimeout=null;
}

async function startFanHum(){
  if(!fanHumBuffer){
    const res=await fetch('Terminal 3/fanhum_lp.wav');
    const buf=await res.arrayBuffer();
    fanHumBuffer=await audioCtx.decodeAudioData(buf);
  }
  stopFanHum();
  fanHumSource=audioCtx.createBufferSource();
  fanHumSource.buffer=fanHumBuffer;
  fanHumSource.loop=true;
  fanHumGain.gain.value=humVolume;
  fanHumSource.connect(fanHumGain);
  fanHumSource.start(0);
}

function stopFanHum(){
  if(fanHumSource){
    fanHumSource.stop();
    fanHumSource.disconnect();
    fanHumSource=null;
  }
}

function playWordFocusSound(){

function sleep(ms){return new Promise(r=>setTrackedTimeout(r,ms));}

async function typeText(el,text){
  for(let ch of text){
    el.textContent+=ch;
    const delay=Math.pow(100-compSpeed,2)/100*baseDelay;
    if(delay>0) await sleep(delay);
  }
  el.textContent+='\n';
  if(el.parentElement===historyEl){
    historyEl.scrollTop=historyEl.scrollHeight;
  }
}

async function typeUserInput(el,text){
  for(let ch of text){
    el.textContent+=ch;
    const delay=Math.pow(100-userSpeed,2)/100*baseDelay;
    if(delay>0){
      playCharFocusSound();
      await sleep(delay);
    }
  }
  el.textContent+='\n';
  if(userSpeed<100) playEnterCharSound();
}

function splitEntities(str){
  const div=document.createElement('div');
  div.textContent=str;
  const encoded=div.innerHTML;
  return encoded.match(/&[a-zA-Z0-9#]+;|./g)||[];
}

function decodeEntity(entity){
  const div=document.createElement('div');
  div.innerHTML=entity;
  return div.textContent;
}

async function typeHtml(el,html){
  const template=document.createElement('template');
  template.innerHTML=html;

  async function typeNode(target,node){
    for(const child of node.childNodes){
      if(child.nodeType===Node.TEXT_NODE){
        await typeTextNode(target,child.textContent);
      }else if(child.nodeType===Node.ELEMENT_NODE){
        const clone=child.cloneNode(false);
        target.appendChild(clone);
        await typeNode(clone,child);
      }
    }
  }

  async function typeTextNode(target,text){
    const units=splitEntities(text);
    const textNode=document.createTextNode('');
    target.appendChild(textNode);
    for(const unit of units){
      textNode.data+=unit.startsWith('&')?decodeEntity(unit):unit;
      const delay=Math.pow(100-compSpeed,2)/100*baseDelay;
      if(delay>0) await sleep(delay);
    }
  }

  await typeNode(el,template.content);
}
function waitForContinue(){
  return new Promise(res=>{
    function handler(e){
      if(e.type==='mousedown'&&e.button===0){cleanup();}
    }
    function cleanup(){
      document.removeEventListener('mousedown',handler);
      pendingWaits.delete(cleanup);
      res();
    }
    pendingWaits.add(cleanup);
    document.addEventListener('mousedown',handler);
  });
}

document.addEventListener('mousedown',e=>{
  if(!typing) return;
  if(e.button===0){
    if(!e.target.closest('#terminal')) return;
    userSpeed=100;
    compSpeed=100;
    skipNextClick=true;
    e.preventDefault();
  }
});
document.addEventListener('click',e=>{
  if(skipNextClick){
    if(!e.target.closest('#terminal')){
      skipNextClick=false;
      return;
    }
    e.preventDefault();
    e.stopPropagation();
    skipNextClick=false;
  }
},true);

async function init(cycle=currentCycle){
  if(cycle!==currentCycle || !powered) return;
  startScrollSound();
  header.innerHTML='';
  stopScrollSound();
  if(hasHacked){
    await showBoot();
  }else if(startLocked){
    await showLockedBoot();
    await startHacking();
  }else{
    await showIntro();
  }
}

async function playBootSequence(seq){
  for(const step of seq){
    if(step.text===''){
      const br=document.createElement('br');
      header.appendChild(br);
      continue;
    }
    const div=document.createElement('div');
    header.appendChild(div);
    if(step.type==='user'){
      div.textContent='>';
      if(userSpeed<100) await sleep(1500);
      await typeUserInput(div,step.text);
    }else{
      startScrollSound();
      await typeText(div,step.text);
      stopScrollSound();
    }
  }
}

async function showLockedBoot(){
  typing=true;
  resetSpeeds();
  restoreInput();
  header.innerHTML='';
  content.innerHTML='';
  header.classList.remove('hack-header');
  content.classList.remove('hack-content');
  leftAlignHeader();
  await playBootSequence(lockedBootSequence);
  typing=false;
}

async function showBoot(){
  typing=true;
  resetSpeeds();
  restoreInput();
  header.innerHTML='';
  content.innerHTML='';
  header.classList.remove('hack-header');
  content.classList.remove('hack-content');
  leftAlignHeader();
  await playBootSequence(bootSequence);
  if(userSpeed<100) await sleep(500);
  typing=false;
  await showIntro();
}

async function showIntro(){
  typing=true;
  resetSpeeds();
  restoreInput();
  startScrollSound();
  header.innerHTML='';
  content.innerHTML='';
  header.classList.remove('hack-header');
  content.classList.remove('hack-content');
  centerHeader();
  for(const line of titleLines){
    const div=document.createElement('div');
    header.appendChild(div);
    await typeText(div,line);
  }
  for(const line of headerLines){
    const div=document.createElement('div');
    div.style.textAlign='left';
    div.style.marginLeft='2ch';
    header.appendChild(div);
    await typeText(div,line);
  }
  stopScrollSound();
  typing=false;
  showScreen('menu');
}

async function showScreen(name){
  restoreInput();
  centerHeader();
  clearResponses();
  screenHistory.push(name);
  currentScreenName=name;
  inputText='';
  input.textContent='';
  updateInput();
  content.innerHTML='';
  currentOptions=[];
  selected=-1;
  const data=screens[name];
  let lines=[];
  let style=null;
  if(Array.isArray(data)){
    lines=data.slice();
  }else if(data){
    lines=(data.items||[]).slice();
    style=data.style||null;
  }
  if(name==='help'){
    // no additional entries
  }
  applyScreenStyle(style);
  let i=0;
  while(i<lines.length){
    resetSpeeds();
    typing=true;
    startScrollSound();
    while(i<lines.length){
      const line=lines[i];
      const div=document.createElement('div');
      content.appendChild(div);
      if(typeof line==='object'){
        div.className='option';
        div.tabIndex=0;
        const hoverSound=typeof line.hoverSound==='string'?line.hoverSound.trim():'';
        const selectSound=typeof line.selectSound==='string'?line.selectSound.trim():'';
        if(hoverSound) div.dataset.hoverSound=hoverSound; else delete div.dataset.hoverSound;
        if(selectSound) div.dataset.selectSound=selectSound; else delete div.dataset.selectSound;
        await typeText(div,line.text);
        div.addEventListener('click',async()=>{
          const sound=div.dataset.selectSound||'';
          if(!playCustomSelectSound(sound)) playSelectSound();
          if(line.screen){
            await showScreen(line.screen);
            if(line.command){
              await new Promise(requestAnimationFrame);
              displayMessage(line.command);
            }
          }else if(line.command){
            displayMessage(line.command);
          }
        });
        div.addEventListener('mouseenter',()=>{
          if(selected>=0){
            currentOptions[selected].classList.remove('selected');
            selected=-1;
          }
          const sound=div.dataset.hoverSound||'';
          if(!playCustomHoverSound(sound)) playFocusSound();
        });
        currentOptions.push(div);
      }else{
        await typeText(div,line);
      }
      if(content.scrollHeight>content.clientHeight){
        content.removeChild(div);
        if(typeof line==='object') currentOptions.pop();
        typing=false;
        stopScrollSound();
        await waitForContinue();
        content.innerHTML='';
        currentOptions=[];
        selected=-1;
        break;
      }else{
        i++;
      }
    }
    if(typing){
      typing=false;
      stopScrollSound();
      if(i<lines.length){
        await waitForContinue();
        content.innerHTML='';
        currentOptions=[];
        selected=-1;
      }
    }
  }
  persistSessionState();
}

document.addEventListener('keydown',e=>{
  if(!powered || typing || !currentOptions.length) return;
  if(e.key==='ArrowDown'){
    if(selected>=0) currentOptions[selected].classList.remove('selected');
    selected=selected<0?0:(selected+1)%currentOptions.length;
    currentOptions[selected].classList.add('selected');
    currentOptions[selected].focus();
    const sound=currentOptions[selected].dataset.hoverSound||'';
    if(!playCustomHoverSound(sound)) playFocusSound();
  }else if(e.key==='ArrowUp'){
    if(selected>=0) currentOptions[selected].classList.remove('selected');
    selected=selected<0?currentOptions.length-1:(selected-1+currentOptions.length)%currentOptions.length;
    currentOptions[selected].classList.add('selected');
    currentOptions[selected].focus();
    const sound=currentOptions[selected].dataset.hoverSound||'';
    if(!playCustomHoverSound(sound)) playFocusSound();
  }else if(e.key==='Enter' && selected>=0){
    currentOptions[selected].click();
  }
});

document.addEventListener('keydown',e=>{
  if(!powered) return;
  if(e.key==='Tab'){
    e.preventDefault();
    if(!typing) goBack();
  }
});

powerButton.addEventListener('click',async()=>{
  try{
    await audioCtx.resume();
    await resumePreloadedAudio();
  }catch(e){
    console.warn('Audio resume failed',e);
  }
  if(!powered){
    currentCycle++;
    const cycle=currentCycle;
    const powerSound=trackAudio(new Audio('Terminal 3/poweron.mp3'));
    powerSound.play();
    powerScreen.style.display='none';
    updateScale();
    prevWidth=window.innerWidth;
    prevHeight=window.innerHeight;
    terminal.classList.add('powered');
    startFanHum();
    if(!terminalLocked){
      header.innerHTML='';
      content.innerHTML='';
      screenHistory=[];
      currentScreenName=null;
      currentOptions=[];
      selected=-1;
      inputText='';
      input.textContent='';
      updateInput();
      hackingActive=false;
      hackingData=null;
      await loadConfig(cycle);
      const restored=await restoreSessionStateIfAvailable();
      if(!restored){
        loadScrollSound().then(()=>{if(currentCycle===cycle) init(cycle);});
      }else{
        loadScrollSound();
      }
    }
    powered=true;
  }else{
    currentCycle++;
    powered=false;
    stopAllAudio();
    clearAllTimeouts();
    cancelWaits();
    typing=false;
    persistSessionState();
    screenHistory=[];
    currentScreenName=null;
    currentOptions=[];
    selected=-1;
    inputText='';
    input.textContent='';
    header.innerHTML='';
    content.innerHTML='';
    applyScreenStyle(null);
    const powerSound=trackAudio(new Audio('Terminal 3/poweroff.mp3'));
    powerSound.play();
    powerScreen.style.display='flex';
    updateScale();
    prevWidth=window.innerWidth;
    prevHeight=window.innerHeight;
    terminal.classList.remove('powered');
    prefMenu.style.display='none';
    hackingActive=false;
    hackingData=null;
  }
});
